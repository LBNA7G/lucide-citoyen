  <script>
    try {
      const settings=JSON.parse(localStorage.getItem('lucide-demo-v1')||'{}');
      const preference=['auto','light','dark'].includes(settings.theme)?settings.theme:'auto';
      const theme=preference==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):preference;
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='light'?'#f6f8f5':'#0b0e18');
    } catch {
      const theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=16" />
